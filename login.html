<section id="add" class="section hidden">
    <div class="form-card">
        <div class="form-header">
            <h2>🎓 Register New Student</h2>
            <p class="form-subtitle">Enter academic and personal details to create a new profile.</p>
        </div>

        <form id="studentForm" onsubmit="event.preventDefault(); addStudent();">
            
            <div class="form-group-wrapper">
                <h3><span class="step-icon">1</span>Academic Details</h3>
                <div class="form-row">
                    <div class="form-input-group">
                        <label for="id">Student ID</label>
                        <input type="text" id="id" placeholder="e.g. STU-101" required>
                        <span class="help-text">Unique identifier.</span>
                    </div>
                    <div class="form-input-group">
                        <label for="department">Department</label>
                        <select id="department" required>
                            <option value="" disabled selected>Select Dept.</option>
                            <option value="cs">Computer Science</option>
                            <option value="it">Information Technology</option>
                            <option value="ece">Electronics</option>
                            <option value="mech">Mechanical</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group-wrapper">
                <h3><span class="step-icon">2</span>Personal Details</h3>
                <div class="form-input-group full-width">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="e.g. Alex Doe" required>
                </div>
                <div class="form-input-group full-width">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. alex.doe@email.com" required>
                </div>
            </div>

            <div class="form-group-wrapper">
                <h3><span class="step-icon">3</span>Grade Data</h3>
                <div class="form-row">
                    <div class="form-input-group">
                        <label for="subjects">Total Subjects</label>
                        <input type="number" id="subjects" min="1" max="10" placeholder="e.g. 5" required>
                    </div>
                    <div class="form-input-group">
                        <label for="marks">Total Marks Obtained</label>
                        <input type="number" id="marks" min="0" max="1000" placeholder="e.g. 450" required>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Register Student</span>
                </button>
                <button type="reset" class="btn-clear">Clear Form</button>
            </div>
        </form>
    </div>
</section>
